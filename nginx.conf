
server {
    listen 80;
    listen [::]:80;

    server_name icherniakov.ru www.icherniakov.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.icherniakov.ru;
    return 301 https://icherniakov.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/icherniakov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icherniakov.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/icherniakov.ru/chain.pem;

    include snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name icherniakov.ru;

    root /var/www/icherniakov.ru;

    index index.html index.xml;

    location / {
        try_files $uri /index.html;
    }

    location /yt-course/ {
        proxy_set_header   Host            $http_host;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-NginX-Proxy   true;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_redirect     off;
        proxy_pass         http://127.0.0.1:8000;
    }

    ssl_certificate /etc/letsencrypt/live/icherniakov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icherniakov.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/icherniakov.ru/chain.pem;
}
